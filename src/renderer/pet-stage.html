<!doctype html>
<!-- pet-stage.html - 桌宠舞台渲染层（v10·完整动作库 + 交互，2026-10-14）
     当前素材：14 个混元比熊动作（pet-moves/，VP9 alpha WebM，单一形象收口）；
     p6-p8/p10/p11/p13/light 系仍是 0486b7d 旧参数化形象，未接线（待 AIGC 资产替换）：
       d1-d4   待机组（随机轮播，随机间隔切换——「拟真风格，4种动画」）
       p1-p13  互动组（左键点击随机播放一个，播完回待机）
       z1-z3 反馈组（鼠标悬停触发，7s 冷却）；t1 拖拽动作（拖拽期间循环）
       heart1  新条目入库反应（pet:react IPC）
     加载：Node fs 读入全部 blob（14MB 内存，src 切换零延迟，无网络/合成器开销）。
     交互模型对齐网易 desktoppet.onMouseEvent：hover/click 驱动动作切片。
     协议不变：paint-ready / pet:cursor-hit / pet:drag-* / pet:summon / pet:context-menu /
     pet:react / pet:scale（滚轮+托盘+右键三入口大小可调）。
     降级链：动作库 → 2D 精灵 → 剪影。 -->
<html>
<head>
<meta charset="utf-8">
<title>ClipSense PetStage（桌宠舞台）</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body.fallback { background: linear-gradient(180deg, #6c5ce7, #4834d4); border-radius: 42%; }
  /* 视频桌宠：底部贴地居中；高度由缩放系数动态控制（pet:scale） */
  /* 右键菜单 v3 · 环形扇形（方案二 2026-10-14 拍板）：主扇 5 叶绕猫左半圆展开，
     模式/大小叶点击展开二级扇（同轴 78px 小半径）；叶 = 玻璃拟态圆钮 spring 错帧弹出；
     失去鼠标焦点自动关闭（主进程 OS 光标轮询 + DOM mouseleave 双通道） */
  #ctxMenu {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    user-select: none;
    /* 覆盖层不拦截事件（2026-10-14 卡死修复）：否则菜单打开时视频点击/右键全被吞；
       仅叶与确认气泡可交互，点空白自然落在 video/body 上 → 关闭逻辑可判定 */
    pointer-events: none;
  }
  #ctxMenu .leaf,
  #ctxMenu .cm-confirm {
    z-index: 120; pointer-events: auto; }
  #ctxMenu.show { display: block; }
  #ctxMenu .leaf {
    position: absolute;
    width: 38px; height: 38px;
    border-radius: 50%;
    /* 静默态中性深灰（2026-10-15 小M：用户宠物毛色未知，主题紫只做交互态） */
    background: rgba(46, 46, 56, 0.94);
    border: 1.5px solid rgba(162, 155, 254, 0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    transition: transform 160ms cubic-bezier(0.34, 1.56, 0.64, 1), background 140ms, border-color 140ms, box-shadow 140ms;
  }
  /* hover/选中才亮主题色 */
  #ctxMenu .leaf:hover { transform: scale(1.18); background: linear-gradient(135deg, #8b7cf0, #5a48d4); border-color: #c9c2ff; box-shadow: 0 0 16px rgba(162, 155, 254, 0.8); }
  #ctxMenu .leaf.selected { border-color: #a29bfe; background: linear-gradient(135deg, #7b6cf0, #5a48d4); box-shadow: 0 0 12px rgba(162, 155, 254, 0.6); }
  #ctxMenu .leaf-sub { width: 32px; height: 32px; font-size: 13px; }
  #ctxMenu .cm-hint {
    z-index: 120;
    position: absolute;
    padding: 3px 9px;
    background: rgba(38, 38, 46, 0.96);
    border: 1px solid rgba(162, 155, 254, 0.45);
    border-radius: 6px;
    font-size: 11px;
    color: #e8e8f0;
    white-space: nowrap;
    display: none;
    pointer-events: none;
  }
  /* Bug2（2026-11-05）模态语义：确认气泡显示期间叶淡出禁点——气泡独占交互，
     消除「气泡被菜单遮挡」/「叶被气泡盖住不可点」两类互相挤压 */
  #ctxMenu.confirm-mode .leaf {
    opacity: 0.18;
    pointer-events: none;
  }
  #ctxMenu .cm-confirm {
    position: absolute;
    z-index: 200; /* 遮挡修复：高于叶 120（同 120 时依赖 DOM 顺序，脆弱） */
    max-width: calc(100% - 12px); /* Bug2（2026-11-05）：小窗口 128px 下 nowrap 180px 气泡
      盖满全窗压住叶——maxWidth 自适应窗宽 + 允许换行，任何档位都完整可读 */
    white-space: normal;
    padding: 5px 10px;
    background: rgba(38, 38, 46, 0.97);
    border: 1px solid rgba(255, 107, 129, 0.55);
    border-radius: 8px;
    font-size: 11px;
    color: #ffd7de;
    white-space: nowrap;
    display: none;
  }
  #ctxMenu .cm-confirm .cm-yes { color: #ff6b81; font-weight: 700; margin-right: 10px; cursor: pointer; }
  #ctxMenu .cm-confirm .cm-no { color: #8a8a96; cursor: pointer; }
  #ctxMenu .cm-confirm .cm-q { display: block; font-size: 11px; color: #b9b9c4; margin-bottom: 4px; white-space: nowrap; }
  #petVideo, #petVideo2 {
    position: absolute; left: 50%; bottom: 0;
    transform: translateX(-50%);
    height: 210px; width: auto;
    user-select: none;
    cursor: pointer;
    transition: opacity 180ms ease;
  }
  #petVideo2 { opacity: 0; }
  #sprite {
    position: absolute; left: 50%; bottom: 6px;
    width: 138px; height: auto;
    transform-origin: 50% 92%;
    will-change: transform;
    user-select: none; -webkit-user-drag: none;
    display: none;
  }
</style>
</head>
<body>

<video id="petVideo" muted autoplay loop playsinline preload="auto"></video>
<video id="petVideo2" muted autoplay playsinline preload="auto"></video>
<canvas id="vrmCanvas" style="position:absolute;inset:0;width:100%;height:100%;display:none"></canvas>
<div id="ctxMenu">
  <div class="cm-hint" id="cmHint"></div>
  <div class="cm-confirm" id="cmConfirm"><span class="cm-q" id="cmQ"></span><span class="cm-yes" id="cmYes">退出</span><span class="cm-no" id="cmNo">取消</span></div>
</div>
<img id="sprite" src="pet-sprite.png" alt="" draggable="false">
<script src="live2d/live2dcubismcore.min.js"></script>
<script src="live2d/pixi.min.js"></script>
<script src="live2d/pixi-live2d-display.min.js"></script>
<script>
'use strict';
try { require('electron').ipcRenderer.send('pet:diag', '[build] RENDER_BUILD_20261015_1050_INPUTLOG block#0'); } catch (_) {}
// 经典脚本桥：ipcRenderer + fs（动作库 blob 读取，module 作用域无 require）
try {
  window.__petIpc = require('electron').ipcRenderer;
  const __fs = require('fs');
  const __path = require('path');
  window.__petMovesDir = __path.join(__dirname, 'pet-moves');
  window.__petReadMove = function (name) {
    const buf = __fs.readFileSync(__path.join(window.__petMovesDir, name + '.webm'));
    return new Blob([buf], { type: 'video/webm' });
  };
} catch (e) { window.__petIpcErr = e; }
window.__petBooted = false;
window.__petFallbackReported = false;
window.__petReportFallback = function (reason) {
  if (window.__petFallbackReported) return;
  window.__petFallbackReported = true;
  try { document.body.classList.add('fallback'); } catch (_) {}
  setTimeout(function () {
    if (!window.__petIpc) return;
    window.__petIpc.send('pet-paint-ready');
    if (reason) window.__petIpc.send('pet:diag', reason);
  }, 50);
};
if (window.__petIpcErr) {
  window.__petReportFallback('ipcRenderer 获取失败: ' + window.__petIpcErr.message);
}
</script>
<script>
'use strict';
const ipcRenderer = window.__petIpc;
const video = document.getElementById('petVideo');
const video2 = document.getElementById('petVideo2');
let frontV = video;   // 当前显示层
let backV = video2;   // 预加载缓冲层（双缓冲交叉淡入 2026-10-20）
function eachV(fn) { fn(video); fn(video2); }
const spriteEl = document.getElementById('sprite');

let mode = 'none';           // webm | sprite
window.__petMode = mode;
function setMode(m) {
  mode = m;
  try { window.__petMode = m; } catch (_) {}
  // Live2D 后端启动链可观测契约 C3（tests/live2d-backend.dom.test.js）：
  // 按尝试顺序 push 后端名（live2d 尝试必在链上；sprite 兜底也记录）
  try {
    window.__petBackendChain = window.__petBackendChain || [];
    if (window.__petBackendChain[window.__petBackendChain.length - 1] !== m) {
      window.__petBackendChain.push(m);
    }
  } catch (_) {}
}

// 大小可调（2026-10-14）：缩放系数 → video 高度动态适配（滚轮/托盘/右键三入口共享）
// v10 重写时丢失本定义导致 ReferenceError（实机取证 L287），补回
let petScale = 1.0;
function applyScale(s) {
  petScale = Number(s) || 1;
  eachV(function (v) { v.style.height = Math.round(210 * petScale) + 'px'; });
  // 滚轮缩放失效修复（2026-11-04 小M）：live2d 下 video 高度变化无视觉效果，
  // 必须重排模型（layoutLive2d 读 petScale 计算缩放/底边锚定）
  if (mode === 'live2d' && __l2d && __l2d.layout) {
    try { __l2d.layout(); } catch (_) {}
  }
  reportBodyRect();
}

let webglOk = false;         // 资产就绪 = 矩形命中；未就绪 = 整窗命中
let pressing = false, moved = false, downSX = 0, downSY = 0, lastDragSent = 0;
let lastHitReport = null;
let cursorNX = 0.5;
// 动作引擎状态
const POOLS = {
  idle: ['d1', 'd2', 'd3', 'd4'],
  // 单一形象收口（2026-10-28）：p6-p8/p10/p11/p13 仍是 0486b7d 旧参数化形象，
  // 与混元比熊混播会「变身」——点击池收敛到 p1-p5 比熊五连，待 AIGC 资产替换后恢复全集
  click: ['p1', 'p2', 'p3', 'p4', 'p5'],
  hover: ['z1', 'z2', 'z3'],
  drag: ['t1'],              // 网易语义修正（2026-10-15 小M）：t1=拖拽动作，拖拽期间循环播放
  react: ['heart1'],
};
let current = '';            // 当前动作名
let state = 'idle';          // idle | action
let lastIdle = '';
let hoverCooldownUntil = 0;
let cursorOnModel = false;

function pick(arr, avoid) {
  const pool = arr.filter(function (n) { return n !== avoid; });
  return pool[Math.floor(Math.random() * pool.length)] || arr[0];
}

// 动作库 blob 预载（本地 fs，14MB，<1s）
const BLOBS = {};
function preloadBlobs() {
  const all = [].concat(POOLS.idle, POOLS.click, POOLS.hover, POOLS.drag, POOLS.react);
  let ok = 0;
  for (const name of all) {
    try {
      BLOBS[name] = URL.createObjectURL(window.__petReadMove(name));
      ok++;
    } catch (err) {
      ipcRenderer.send('pet:diag', 'blob 预载失败 ' + name + ': ' + (err && err.message));
    }
  }
  ipcRenderer.send('pet:diag', '动作库预载 ' + ok + '/' + all.length);
  return ok === all.length;
}

// 卡顿修复（2026-10-29）：
// ① 复用后缓冲前先 pause 旧解码；交叉淡出（180ms）完成后暂停隐藏层——
//    旧实现双 video 永续双解码，VP9 alpha 走软解路径时解码负载 ×2（持续掉帧主嫌疑）
// ② 首帧对齐交换：requestVideoFrameCallback 等新片第一帧真正上屏才淡入——
//    旧 loadeddata 交换在首帧未就绪时闪空白帧（动作切换 hitch）
// ③ 修复 paint-ready 断链：首播实际落在 video2，旧监听却挂 video（无 src 永不触发），
//    全靠主进程 1200ms 兜底显示——首帧交换时双 rAF 直发，恢复 paint-verified show
let fadePauseTimer = null;
function play(name, loop) {
  if (!BLOBS[name]) return;
  current = name;
  const incoming = backV;
  const outgoing = frontV;
  incoming.pause();
  incoming.loop = !!loop;
  incoming.src = BLOBS[name]; // 换 src 自动回 0 位
  const swap = function () {
    incoming.style.opacity = '1';
    outgoing.style.opacity = '0';
    frontV = incoming;
    backV = outgoing;
    if (fadePauseTimer) clearTimeout(fadePauseTimer);
    fadePauseTimer = setTimeout(function () {
      if (backV === outgoing && !outgoing.paused) outgoing.pause(); // 淡出后暂停隐藏层
    }, 240);
    reportBodyRect();
    if (!window.__petPaintSent) {
      window.__petPaintSent = true;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { ipcRenderer.send('pet-paint-ready'); });
      });
    }
  };
  incoming.play().then(function () {
    if (typeof incoming.requestVideoFrameCallback === 'function') {
      incoming.requestVideoFrameCallback(function () { swap(); });
    } else {
      swap();
    }
  }).catch(function () {
    const onld = function () { incoming.removeEventListener('loadeddata', onld); swap(); };
    incoming.addEventListener('loadeddata', onld);
  });
}

function playIdle(now) {
  state = 'idle';
  const pickName = pick(POOLS.idle, lastIdle);
  lastIdle = pickName;
  play(pickName, true);
}
function playAction(poolName, backToIdle) {
  state = 'action';
  const pickName = pick(POOLS[poolName]);
  play(pickName, false);
  // ended 由统一 ended 监听回 idle；backToIdle 预留
}
function triggerReact() {
  state = 'action';
  nextIdleAt = performance.now() + 4200;
  if (mode === 'live2d' && window.__petLive2dAction) window.__petLive2dAction('react');
  else if (mode === 'vrm' && window.__vrmAPI) window.__vrmAPI.action('react');
  else if (mode === 'webm') playAction('react');
}
let nextIdleAt = 0;

// ==================== 主帧循环（行为调度） ====================
function tick(now) {
  requestAnimationFrame(tick);
  if (mode !== 'webm') return;
  // 待机轮播：每 8-16s 换一个待机动作（d1-d4 轮着来，不重复上一个）
  if (state === 'idle' && now >= nextIdleAt) {
    lastIdle = current;
    playIdle(now);
    nextIdleAt = now + 8000 + Math.random() * 8000;
  }
  // 拖拽挣扎微摆
  if (moved) {
    eachV(function (v) { v.style.transform =
      'translateX(calc(-50% + ' + ((cursorNX - 0.5) * 8).toFixed(1) + 'px)) rotate(' + (Math.sin(t(now) * 8) * 3).toFixed(2) + 'deg)'; });
  } else if (!ctxOpen) {
    eachV(function (v) { if (v.style.transform !== 'translateX(-50%)') v.style.transform = 'translateX(-50%)'; });
  }
}
function t(now) { return now / 1000; }
requestAnimationFrame(tick);
// 卡顿取证（2026-10-29）：每 5s 上报解码掉帧/就绪态——区分「解码掉帧」与「切换 hitch/合成抖动」
setInterval(function () {
  if (mode !== 'webm' || !frontV.getVideoPlaybackQuality) return;
  const q = frontV.getVideoPlaybackQuality();
  ipcRenderer.send('pet:diag', '[perf] ' + current + ' dropped=' + q.droppedVideoFrames + '/' + q.totalVideoFrames
    + ' ready=' + frontV.readyState + ' paused=' + frontV.paused + ' t=' + frontV.currentTime.toFixed(2));
}, 5000);

// ==================== 命中检测（video 矩形；未就绪整窗） ====================
function cursorHit(x, y) {
  // Live2D 模式：模型包围盒命中（TC-202；vrm video-rect-0 教训 ：322——video 桩矩形
  // (900,900) 哨兵/videoWidth=0 不得参与判定）。置于 webglOk 检查之前：live2d 模式
  // 下 webglOk 恒 false，否则整窗命中短路包围盒语义。
  if (mode === 'live2d') {
    var lb = live2dBounds();
    if (!lb) return false;
    return x >= lb.x && x <= lb.x + lb.w && y >= lb.y && y <= lb.y + lb.h;
  }
  if (!webglOk) return true;
  if (mode === 'vrm') {
    // Shiba 四足站姿命中区（2026-10-26）：居中 130px 宽 × 下 62% 高（横体型）
    const W = window.innerWidth, H = window.innerHeight;
    return x >= W / 2 - 65 && x <= W / 2 + 65 && y >= H * 0.38 && y <= H;
  }
  const r = frontV.getBoundingClientRect();
  const vw = frontV.videoWidth, vh = frontV.videoHeight;
  if (!vw || !vh) return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  // 命中区收缩（2026-10-20 小M：透明 WebM 全矩形命中 → 周围空白也能拖动）：
  // 视频实际显示宽 = 显示高 × 自然宽高比；底中锚定（CSS bottom:0; left:50%）
  const dispH = r.height;
  const dispW = dispH * (vw / vh);
  const cx = r.left + r.width / 2;
  const bottom = r.bottom;
  return x >= cx - dispW / 2 && x <= cx + dispW / 2 && y >= bottom - dispH && y <= bottom;
}
let lastEchoSentAt = 0; // echo-alive 节流（2026-10-22 动态穿透心跳）
function reportBodyRect() {
  // Live2D 分支（TC-203）：模型包围盒直报（Math.round 与主进程约定一致）——
  // 不得走 video 分支（哨兵矩形误判即红，vrm 教训同上）
  if (mode === 'live2d') {
    var lbr = live2dBounds();
    if (lbr) ipcRenderer.send('pet:body-rect', lbr);
    return;
  }
  // 命中穿透 v2（2026-10-23）：本体矩形上报（窗口相对 DIP）——主进程 150ms 轮询
  // 用它判定光标是否在本体上，驱动整窗交互/穿透切换（无 forward 依赖）。
  // vrm 分支（2026-10-26）：与 cursorHit 的 vrm 矩形同模型（居中 96px 宽 × 下 78% 高）。
  // 修复：vrm 模式下 video 是 display:none，getBoundingClientRect 返回 0 →
  // 主进程拿到垃圾矩形 → 穿透/交互错乱 → 拖拽失效（小M 实测）。
  if (mode === 'vrm') {
    const W = window.innerWidth, H = window.innerHeight;
    // Shiba 四足站姿命中区（2026-10-26 模型切换）：居中 130px 宽 × 下 62% 高
    ipcRenderer.send('pet:body-rect', {
      x: Math.round(W / 2 - 65), y: Math.round(H * 0.38), w: 130, h: Math.round(H * 0.62),
    });
    return;
  }
  const r = frontV.getBoundingClientRect();
  const vw = frontV.videoWidth, vh = frontV.videoHeight;
  let x, y, w, h;
  if (vw && vh) {
    h = r.height;
    w = h * (vw / vh);
    x = r.left + r.width / 2 - w / 2;
    y = r.bottom - h;
  } else {
    x = r.left; y = r.top; w = r.width; h = r.height;
  }
  ipcRenderer.send('pet:body-rect', { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) });
}
function reportHit(x, y) {
  const hit = cursorHit(x, y);
  // echo-alive（2026-10-22 动态穿透心跳）：主进程 500ms 看门狗以「窗口内移动是否有回声」
  // 判定转发链路活性——移动时节流回报（250ms），状态变化仍立即上报
  const nowE = performance.now();
  if (hit !== lastHitReport || nowE - lastEchoSentAt > 250) {
    lastEchoSentAt = nowE;
    ipcRenderer.send('pet:cursor-hit', hit);
  }
  if (hit === lastHitReport) return;
  lastHitReport = hit;
  // 悬停触发（网易 onMouseEvent hover 语义）：进入模型瞬间 + 冷却 7s + 仅待机态
  const now = performance.now();
  if (hit && !cursorOnModel && state === 'idle' && now >= hoverCooldownUntil) {
    hoverCooldownUntil = now + 7000;
    if (mode === 'live2d' && window.__petLive2dAction) window.__petLive2dAction('hover');
    else if (mode === 'vrm' && window.__vrmAPI) window.__vrmAPI.action('hover');
    else playAction('hover');
  }
  if (!hit && cursorOnModel) {
    hoverCooldownUntil = Math.max(hoverCooldownUntil, now + 3000); // 离开冷却：防边界进出反复触发
  }
  cursorOnModel = hit;
}

// ==================== 指针交互（协议不变） ====================
window.addEventListener('mousemove', function (e) {
  // Live2D 眼神跟随（TC-201，A3：focus((x/W)-0.5, (y/H)-0.5) ∈ [-0.5,0.5]）；
  // FocusController 内建每帧插值，这里只送目标值（主进程合成 mousemove 亦同路驱动）
  if (mode === 'live2d' && __l2d && __l2d.model && __l2d.model.internalModel &&
      __l2d.model.internalModel.focusController) {
    try {

    if (!window.__vrmAccept) throw new Error('classic bridge missing');
    const canvas = document.getElementById('vrmCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(220, 220, false);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 50);
    camera.position.set(0, 0.85, 3.2);
    camera.lookAt(0, 0.62, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 1.25));
    const key = new THREE.DirectionalLight(0xffffff, 1.5);
    key.position.set(1.2, 2.2, 2.4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xdfe8ff, 0.6);
    fill.position.set(-1.5, 1.0, 1.5);
    scene.add(fill);

    const loader = new GLTFLoader();
    // Draco 解码（2026-10-26 混元模型切换：网格经 KHR_draco_mesh_compression 压缩）
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('./libs/draco/gltf/');
    loader.setDRACOLoader(dracoLoader);
    loader.register((parser) => new VRMLoaderPlugin(parser));
    const buf = await (await fetch('./pet-hunyuan-opt.glb')).arrayBuffer();
    const gltf = await loader.parseAsync(buf, '');
    const root = gltf.scene;
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const baseScale = 1.1 / Math.max(0.0001, size.y);
    root.scale.setScalar(baseScale);
    const b2 = new THREE.Box3().setFromObject(root);
    const c2 = b2.getCenter(new THREE.Vector3());
    root.position.set(root.position.x - c2.x, root.position.y - b2.min.y, root.position.z - c2.z);
    const baseY = root.position.y;
    // ---- MToon 卡通渲染升级（2026-10-26 小M「没有网易的好看」）：
    // CatMoth 原生 unlit 平涂材质 → 换 MToonMaterial（赛璐璐分档阴影 + 描边）。
    // three-vrm 的 VRM 1.0 加载器已把 unlit 映射为 MToon，这里做的是调参增强：
    // ① 描边开箱即用（outlineWidthMode）；② shadeColorFactor 压暗为暖灰
    // （anime 感分档）；③ rimLight 假边缘光（材质层菲涅尔近似）。
    let mtoonCount = 0, mat0type = 'none';
    root.traverse((obj) => {
      if (obj.material && mat0type === 'none') mat0type = obj.material.type;
      const mat = obj.material;
      if (!mat || mat.isMToonMaterial !== true) return;
      mtoonCount++;
      // 描边：0.012（220px 视口下约 3px，肉眼可辨）；色加深
      if ('outlineWidthMode' in mat) mat.outlineWidthMode = 'world';
      if ('outlineWidthFactor' in mat) mat.outlineWidthFactor = 0.012;
      if ('outlineColorFactor' in mat) mat.outlineColorFactor.setRGB(0.10, 0.09, 0.14);
      // 阴影分档：明显灰紫（对比不足则 MToon 无感）
      if ('shadeColorFactor' in mat) mat.shadeColorFactor.setRGB(0.38, 0.35, 0.45);
      // 主光增强：分档阴影需要强光对比才可见
      if ('shadeToonyFactor' in mat) mat.shadeToonyFactor = 0.9;
      mat.needsUpdate = true;
    });
    try { ipcRenderer.send('pet:diag', '[vrm] material census: ' + JSON.stringify({ mtoon: mtoonCount, firstMatType: mat0type })); } catch (_) {}
    // GLB 动物模型无 VRM 弹簧骨骼（Tail/腿骨由内置动画驱动）
    scene.add(root);

    // GLB 动物模型：无 lookAt/表情系统（em=null 走无表情分支）
    const lookTarget = null;
    const em = null;

    // 混元模型无内置动画 → 整体动作系统（呼吸/跳跃/摇摆由帧循环程序化驱动，
    // action 状态机控制幅度与表情式反馈）
    let action = null; // { name, t0, dur }
    let blinkPhase = 0, blinkNext = 2 + Math.random() * 3;

    window.__vrmAPI = {
      action(name) {
        // 整体动作映射（2026-10-26 混元切换）：无骨骼动画，用整体变换语义
        if (name === 'idle') { action = null; }
        else if (name === 'hover') { action = { name: 'hover', t0: performance.now(), dur: 1600 }; }
        else if (name === 'react') { action = { name: 'react', t0: performance.now(), dur: 1400 }; }
        else if (name === 'drag') { action = { name: 'drag', t0: performance.now(), dur: 1e9 }; }
      },
    };

    const clock = new THREE.Clock();
    function frame() {
      requestAnimationFrame(frame);
      const delta = Math.min(clock.getDelta(), 0.1);
      // 混元模型无内置动画（2026-10-26）：动作由下方整体变换驱动，无 mixer
      const now = performance.now();
      const t = now / 1000;
      // 呼吸 + 轻摆（常驻）
      const br = Math.sin(t * 2.1);
      root.scale.set(baseScale * (1 - 0.004 * br), baseScale * (1 + 0.008 * br), baseScale * (1 - 0.004 * br));
      root.rotation.z = Math.sin(t * 0.7) * 0.03;
      // 视线跟随光标（主进程/经典脚本写入 window.__petCursorNX/NY）
      const nx = (window.__petCursorNX !== undefined) ? window.__petCursorNX : 0.5;
      const ny = (window.__petCursorNY !== undefined) ? window.__petCursorNY : 0.5;
      // GLB 模型无 lookAt 系统（视线跟随退役，2026-10-26 模型切换）
      // 轻微朝向光标（Y 轴 ±0.35rad）：MToon 分档阴影下转身立体感显著
      root.rotation.y = (nx - 0.5) * 0.7;
      // 表情基线
      let joy = 0, fun = 0;
      let rootY = baseY;
      if (action) {
        const t01 = Math.min(1, (now - action.t0) / action.dur);
        if (action.name === 'hover') {
          fun = Math.sin(t01 * Math.PI);
          root.rotation.x = -0.1 * Math.sin(t01 * Math.PI * 2);
          if (t01 >= 1) action = null;
        } else if (action.name === 'react') {
          joy = 1;
          rootY = baseY + Math.abs(Math.sin(t01 * Math.PI * 2)) * 0.14;
          root.rotation.z += Math.sin(t01 * Math.PI * 6) * 0.06;
          if (t01 >= 1) action = null;
        } else if (action.name === 'drag') {
          root.rotation.z += Math.sin(t * 8) * 0.07;
          root.rotation.x = 0.06;
        }
      } else {
        rootY = baseY;
      }
      root.position.y = rootY;
      if (em) {
        em.setValue('joy', joy);
        em.setValue('fun', fun);
        // 眨眼
        blinkNext -= delta;
        if (blinkNext <= 0 && blinkPhase <= 0) { blinkPhase = 0.22; blinkNext = 2.5 + Math.random() * 3.5; }
        if (blinkPhase > 0) {
          blinkPhase -= delta;
          em.setValue('blink', Math.sin(Math.max(0, blinkPhase) / 0.22 * Math.PI));
        } else {
          em.setValue('blink', 0);
        }
      }
      renderer.render(scene, camera);
    }
    frame();
    window.__vrmAccept({});
  } catch (err) {
    if (window.__vrmFail) window.__vrmFail((err && err.message) || String(err));
  }
})();
</script>
</body>
</html>
