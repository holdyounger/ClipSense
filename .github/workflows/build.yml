name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Validate JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/main/clipboard-monitor.js
          node --check src/main/edge-detector.js
          node --check src/main/focus-tracker.js
          node --check src/main/index.js
          node --check src/main/paste-bridge.js
          node --check src/main/storage.js
          node --check src/main/updater.js
          node --check src/main/trigger-anim.js
          node --check src/renderer/i18n.js
          node --check src/renderer/main.js
          node --check src/renderer/preload.js
          node --check src/renderer/renderer.js
          node --check src/renderer/slide-anim.js
          node --check src/renderer/spring-anim.js
          node --check src/renderer/entry-anim.js
          node --check src/renderer/dock-anim.js

  build-windows:
    name: Build (Windows)
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 版本同步（2026-09-20）：electron-builder 只认 package.json version，不看 git tag。
      # tag 触发时把 tag 名剥 v 写回 package.json，保证安装包版本与 Release 版本一致，
      # 不再依赖打 tag 前手动改 version（v1.0.2 Release 挂 0.1.0 包的根因）。
      - name: Sync package.json version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($tag -notmatch '^\d+\.\d+\.\d+$') { Write-Error "tag 名不是 v*.*.* 格式: ${{ github.ref_name }}" }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $tag
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding UTF8
          Write-Host "package.json version → $tag"

      - name: Build Electron app (Windows)
        shell: pwsh
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipsense-windows-build
          path: |
            build/*.exe
            build/*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: clipsense-windows-build
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
